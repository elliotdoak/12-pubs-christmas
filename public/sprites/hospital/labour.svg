<svg xmlns="http://www.w3.org/2000/svg" width="288" height="160" viewBox="0 0 288 160">
  <defs>
    <g id="note">
      <ellipse cx="0" cy="0" rx="3.6" ry="2.7" transform="rotate(-20)" fill="#FFB800" stroke="#1A1A1A" stroke-width="1.2"/>
      <path d="M3 -1 V-14 Q8 -11 8 -6" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g id="notes2">
      <ellipse cx="0" cy="0" rx="3.4" ry="2.6" transform="rotate(-20)" fill="#FFB800" stroke="#1A1A1A" stroke-width="1.2"/>
      <ellipse cx="10" cy="-3" rx="3.4" ry="2.6" transform="rotate(-20 10 -3)" fill="#FFB800" stroke="#1A1A1A" stroke-width="1.2"/>
      <path d="M3 -1 V-14 L13 -17 V-4" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
    </g>
    <pattern id="gown" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#BFD9F0"/>
      <circle cx="3" cy="3" r="0.9" fill="#8DB6DE"/>
    </pattern>
  </defs>

  <!-- Room: wall, dado rail, tiled floor -->
  <rect width="288" height="160" fill="#E6EFF7"/>
  <rect y="98" width="288" height="22" fill="#D6E3EE"/>
  <rect y="97" width="288" height="2" fill="#C2D2E0"/>
  <rect y="120" width="288" height="40" fill="#C7D3DE"/>
  <path d="M0 120 H288 M0 132 H288 M0 146 H288 M40 120 L28 160 M100 120 L96 160 M160 120 L164 160 M220 120 L232 160" stroke="#B4C2CF" stroke-width="1"/>
  <!-- Curtain bunched on its rail -->
  <rect x="0" y="4" width="100" height="2" rx="1" fill="#9AA5B0"/>
  <path d="M2 6 Q6 40 3 96 L13 96 Q16 40 12 6 Z" fill="#F4C9D6" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M7 10 Q9 50 8 92" fill="none" stroke="#E3A9BC" stroke-width="1.4"/>
  <!-- Wall clock: it's late -->
  <circle cx="98" cy="22" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M98 22 V16 M98 22 L102.5 24" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Heart monitor on its arm -->
  <rect x="24" y="12" width="44" height="26" rx="3" fill="#233040" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M28 27 H38 L41 19 L45 33 L48 22 L50 27 H64" fill="none" stroke="#3BD16F" stroke-width="2" stroke-linejoin="round"/>
  <text x="61" y="19" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="5" fill="#3BD16F">142</text>
  <path d="M46 38 V46 H30" fill="none" stroke="#8A96A2" stroke-width="3"/>

  <!-- IV drip -->
  <path d="M84 30 V120 M78 120 H90" stroke="#8A96A2" stroke-width="2" stroke-linecap="round"/>
  <path d="M80 30 H88" stroke="#8A96A2" stroke-width="2" stroke-linecap="round"/>
  <rect x="80" y="32" width="8" height="12" rx="2" fill="#DDEFFC" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M84 44 Q82 70 70 84" fill="none" stroke="#9AB8D0" stroke-width="1"/>

  <!-- Karaoke screen on the wall -->
  <rect x="108" y="6" width="80" height="42" rx="3" fill="#2B2350" stroke="#1A1A1A" stroke-width="2.5"/>
  <text x="148" y="18" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="9" fill="#FF5FA2" letter-spacing="1">KARAOKE</text>
  <rect x="117" y="24" width="62" height="5" rx="2.5" fill="#FFFFFF" opacity="0.35"/>
  <rect x="117" y="24" width="38" height="5" rx="2.5" fill="#FFE14D"/>
  <circle cx="156" cy="21" r="2.2" fill="#FF5FA2"/>
  <rect x="117" y="34" width="50" height="5" rx="2.5" fill="#FFFFFF" opacity="0.35"/>
  <rect x="114" y="48" width="4" height="5" fill="#1A1A1A"/>
  <rect x="178" y="48" width="4" height="5" fill="#1A1A1A"/>

  <!-- Bed -->
  <ellipse cx="80" cy="124" rx="66" ry="4" fill="#1A1A1A" opacity="0.12"/>
  <rect x="13" y="54" width="9" height="66" rx="2" fill="#8A96A2" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M28 106 V118 M128 106 V118" stroke="#6E7A86" stroke-width="4"/>
  <circle cx="28" cy="120" r="3" fill="#3A3A3A"/>
  <circle cx="128" cy="120" r="3" fill="#3A3A3A"/>
  <rect x="18" y="96" width="124" height="11" rx="2" fill="#9AA5B0" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="20" y="88" width="120" height="10" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Bed rail she's gripping -->
  <path d="M60 86 H96" stroke="#6E7A86" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M62 86 V93 M94 86 V93" stroke="#6E7A86" stroke-width="2"/>

  <!-- Joanna, propped up, mid-contraction -->
  <ellipse cx="36" cy="78" rx="15" ry="11" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <!-- long wavy hair behind -->
  <path d="M30 60 Q27 44 44 43 Q61 43 59 60 Q62 69 59 76 Q63 83 59 90 Q54 96 49 91 Q52 85 49 79 Q51 72 49 66 L38 66 Q36 72 38 79 Q35 85 38 91 Q33 96 29 90 Q26 82 30 76 Q27 69 30 60 Z" fill="#6E4128" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M32.5 66 q-2.5 6 0.5 12 q-2.5 5 0 10 M56.5 66 q2.5 6 -0.5 12 q2.5 5 0 10" fill="none" stroke="#B07A4E" stroke-width="2" stroke-linecap="round"/>
  <path d="M31 84 q-1 4 1 7 M57.5 84 q1 4 -1 7" fill="none" stroke="#C99466" stroke-width="2" stroke-linecap="round"/>
  <!-- gown body and the bump -->
  <path d="M38 74 Q44 70 52 74 Q62 72 70 80 Q72 86 66 90 L40 90 Q36 82 38 74 Z" fill="url(#gown)" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <!-- face -->
  <ellipse cx="44.5" cy="59" rx="10" ry="11" fill="#F6D3BC" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M35 55 Q38 47 44.5 47.5 Q51 47 54 55 Q50 50.5 45 51 L44 51 Q39 50.5 35 55 Z" fill="#6E4128"/>
  <!-- eyes screwed shut, brows furrowed -->
  <path d="M38 57 l3.5 1.5 l-3.5 1.5 M51 57 l-3.5 1.5 l3.5 1.5" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M37.5 54 l4.5 1.6 M51.5 54 l-4.5 1.6" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/>
  <ellipse cx="44.5" cy="65" rx="3.2" ry="3.4" fill="#7A2A2A" stroke="#1A1A1A" stroke-width="1"/>
  <path d="M42.3 63.4 H46.7" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="38.5" cy="62" r="2" fill="#E88080" opacity="0.8"/>
  <circle cx="50.5" cy="62" r="2" fill="#E88080" opacity="0.8"/>
  <path d="M57 49 q2.5 4 0 6 q-2.5 -2 0 -6 Z M60.5 57 q2 3 0 4.6 q-2 -1.6 0 -4.6 Z" fill="#7FB3E6" stroke="#1A1A1A" stroke-width="0.8"/>
  <!-- blanket over her legs -->
  <path d="M64 92 L64 84 Q74 80 84 82 Q104 78 138 84 L138 92 Z" fill="#9CC3EA" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M66 88 H136" stroke="#6F9ED0" stroke-width="2"/>
  <!-- bump, one hand on it -->
  <path d="M50 76 Q58 60 72 70 Q78 76 72 84 Q62 88 52 84 Z" fill="url(#gown)" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="58" cy="76" rx="3.4" ry="2.8" fill="#F6D3BC" stroke="#1A1A1A" stroke-width="1.4"/>
  <!-- other hand gripping the rail, white-knuckled -->
  <path d="M42 80 Q50 90 68 86" fill="none" stroke="#1A1A1A" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M42 80 Q50 90 68 86" fill="none" stroke="#BFD9F0" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="70" cy="86" r="3.6" fill="#F6D3BC" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- Doctor, side-eyeing the karaoke -->
  <ellipse cx="166" cy="124" rx="16" ry="3" fill="#1A1A1A" opacity="0.12"/>
  <rect x="155" y="108" width="8" height="15" fill="#227566" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="168" y="108" width="8" height="15" fill="#227566" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M153 124 H164 M167 124 H178" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M152 76 Q165 69 178 76 L180 110 H150 Z" fill="#2E9C8A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M159 74 L165 84 L171 74" fill="none" stroke="#227566" stroke-width="1.6"/>
  <!-- stethoscope -->
  <path d="M158 75 Q156 90 163 92 Q170 90 172 75" fill="none" stroke="#3A3A3A" stroke-width="1.5"/>
  <circle cx="163" cy="93" r="2" fill="#C8CDD3" stroke="#1A1A1A" stroke-width="1"/>
  <!-- arm holding the clipboard -->
  <path d="M154 80 Q146 92 150 98" fill="none" stroke="#1A1A1A" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M154 80 Q146 92 150 98" fill="none" stroke="#2E9C8A" stroke-width="4.5" stroke-linecap="round"/>
  <rect x="139" y="86" width="13" height="17" rx="1.5" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.8" transform="rotate(-8 145 94)"/>
  <path d="M142 92 H149 M142 96 H149 M142 100 H146" stroke="#9AA5B0" stroke-width="1.3" transform="rotate(-8 145 94)"/>
  <circle cx="151" cy="97" r="2.8" fill="#9ED3C8" stroke="#1A1A1A" stroke-width="1.3"/>
  <!-- other hand on hip -->
  <path d="M177 80 Q186 90 179 98" fill="none" stroke="#1A1A1A" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M177 80 Q186 90 179 98" fill="none" stroke="#2E9C8A" stroke-width="4.5" stroke-linecap="round"/>
  <!-- head, cap, mask, eyes looking right at David -->
  <circle cx="165" cy="61" r="10" fill="#C9906E" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M155 59 Q154.5 48 165 48 Q175.5 48 175 59 Z" fill="#2E9C8A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <rect x="157.5" y="62" width="15" height="7.5" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
  <circle cx="162" cy="59" r="1.9" fill="#FFFFFF"/>
  <circle cx="169" cy="59" r="1.9" fill="#FFFFFF"/>
  <circle cx="163" cy="59" r="1.1" fill="#1A1A1A"/>
  <circle cx="170" cy="59" r="1.1" fill="#1A1A1A"/>
  <path d="M159.5 56 l4.5 -1 M167 55 l4.5 1" stroke="#1A1A1A" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Speaker on the floor -->
  <rect x="262" y="118" width="22" height="34" rx="2" fill="#2B2B2B" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="273" cy="128" r="4" fill="#444" stroke="#111" stroke-width="1.2"/>
  <circle cx="273" cy="142" r="6" fill="#444" stroke="#111" stroke-width="1.2"/>
  <circle cx="273" cy="142" r="2" fill="#666"/>

  <!-- David, front and centre, giving it everything -->
  <ellipse cx="232" cy="155" rx="26" ry="3.5" fill="#1A1A1A" opacity="0.15"/>
  <!-- legs, planted wide -->
  <path d="M216 116 L208 152 H221 L227 120 Z M237 120 L243 152 H256 L248 116 Z" fill="#3B4A63" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M214 118 L211 140 M245 118 L250 140" stroke="#2E3B50" stroke-width="1.4"/>
  <path d="M204 153 H222 M241 153 H260" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round"/>
  <!-- outstretched arm (behind the body) -->
  <path d="M248 84 L262 72 L272 56" fill="none" stroke="#1A1A1A" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M248 84 L262 72" fill="none" stroke="#F6F1E7" stroke-width="7" stroke-linecap="round"/>
  <path d="M262 72 L272 56" fill="none" stroke="#F0CDB0" stroke-width="7" stroke-linecap="round"/>
  <path d="M268 50 l2 4 M273 48 l0.5 5 M278 50 l-2 4.5" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="273" cy="55" r="5" fill="#F0CDB0" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- tee -->
  <path d="M208 82 Q230 72 252 82 L250 120 H212 Z" fill="#F6F1E7" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M212 96 Q214 110 213 118 M248 96 Q246 110 247 118" fill="none" stroke="#DED6C8" stroke-width="2"/>
  <path d="M221 79 Q230 100 239 79" fill="none" stroke="#9EA4AB" stroke-width="1.4"/>
  <circle cx="230" cy="98.5" r="2.8" fill="none" stroke="#9EA4AB" stroke-width="1.6"/>
  <path d="M221 108 q2 -3 4 0 t4 0 t4 0 t4 0 t3 0" fill="none" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round"/>
  <!-- neck and head -->
  <rect x="224" y="70" width="12" height="10" fill="#D9AE90" stroke="#1A1A1A" stroke-width="1.6"/>
  <ellipse cx="230" cy="55" rx="14" ry="16" fill="#F0CDB0" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="215.5" cy="57" rx="2.4" ry="3.4" fill="#F0CDB0" stroke="#1A1A1A" stroke-width="1.4"/>
  <ellipse cx="244.5" cy="57" rx="2.4" ry="3.4" fill="#F0CDB0" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M215.5 53 Q213 41 222 37 Q230 31.5 239 34.5 Q247 37.5 244.5 53 Q242 45.5 234 44 Q225 43.5 220 47.5 Q217.5 50 215.5 53 Z" fill="#3B2A1F" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M223 41 q6 -3.5 13 -2 M221 44.5 q7 -3 15 -1.5" fill="none" stroke="#5A4231" stroke-width="1.2" stroke-linecap="round"/>
  <!-- trimmed beard, mouth wide open -->
  <path d="M216.5 57 Q217 72.5 230 74.5 Q243 72.5 243.5 57 Q241 61.5 237 61 Q230 58.5 223 61 Q219 61.5 216.5 57 Z" fill="#3B2A1F" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="230" cy="65" rx="5" ry="5.5" fill="#7A2A2A" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M226.5 61.6 Q230 60.6 233.5 61.6" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
  <ellipse cx="230" cy="67.5" rx="2.6" ry="1.6" fill="#E07070"/>
  <!-- eyes shut, brows up: feeling every word -->
  <path d="M221 52 q3 2.4 6 0 M233 52 q3 2.4 6 0" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M220.5 46.5 q3.5 -2.5 7 -0.5 M232.5 46 q3.5 -2 7 0.5" fill="none" stroke="#2A1D15" stroke-width="2" stroke-linecap="round"/>
  <!-- mic arm: shoulder, elbow down and out, fist under his chin -->
  <path d="M212 86 L201 101 L214 84" fill="none" stroke="#1A1A1A" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M212 86 L201 101" fill="none" stroke="#F6F1E7" stroke-width="7" stroke-linecap="round"/>
  <path d="M201 101 L214 84" fill="none" stroke="#F0CDB0" stroke-width="7" stroke-linecap="round"/>
  <path d="M216 82 L222 71" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <path d="M216 82 L222 71" stroke="#3A3A3A" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="215" cy="83" r="4.6" fill="#F0CDB0" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="223.5" cy="68" r="5.4" fill="#C8CDD3" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M220.5 66 L226.5 70 M220.5 70 L226.5 66 M223.5 63 V73" stroke="#8A9199" stroke-width="0.9"/>
  <!-- sound pouring out -->
  <path d="M246 62 q4 -3 8 0 M247 68 q5 -3.5 10 0" fill="none" stroke="#FFB800" stroke-width="1.6" stroke-linecap="round"/>
  <use href="#note" x="252" y="40"/>
  <use href="#notes2" x="258" y="22"/>
  <use href="#note" x="200" y="38"/>
  <use href="#note" x="270" y="92" transform="rotate(10 270 92)"/>
  <path d="M258 112 q3 -3 0 -6 M263 113 q5 -5 0 -10" fill="none" stroke="#FFB800" stroke-width="1.4" stroke-linecap="round"/>
</svg>
