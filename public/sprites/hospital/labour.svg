<svg xmlns="http://www.w3.org/2000/svg" width="288" height="160" viewBox="0 0 288 160">
  <defs>
    <g id="note">
      <ellipse cx="0" cy="0" rx="3.6" ry="2.7" transform="rotate(-20)" fill="#FFB800" stroke="#1A1A1A" stroke-width="1.2"/>
      <path d="M3 -1 V-14 Q8 -11 8 -6" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g id="notes2">
      <ellipse cx="0" cy="0" rx="3.4" ry="2.6" transform="rotate(-20)" fill="#FFB800" stroke="#1A1A1A" stroke-width="1.2"/>
      <ellipse cx="10" cy="-3" rx="3.4" ry="2.6" transform="rotate(-20 10 -3)" fill="#FFB800" stroke="#1A1A1A" stroke-width="1.2"/>
      <path d="M3 -1 V-14 L13 -17 V-4" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Room -->
  <rect width="288" height="124" fill="#E4EEF6"/>
  <rect y="118" width="288" height="6" fill="#CFDDEA"/>
  <rect y="124" width="288" height="36" fill="#C3CFDA"/>
  <path d="M0 136 H288 M0 150 H288" stroke="#B1BECA" stroke-width="1"/>

  <!-- Heart monitor -->
  <rect x="24" y="10" width="44" height="28" rx="3" fill="#233040" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M28 26 H38 L41 18 L45 33 L48 22 L50 26 H64" fill="none" stroke="#3BD16F" stroke-width="2" stroke-linejoin="round"/>
  <rect x="44" y="38" width="4" height="40" fill="#8A96A2"/>

  <!-- Karaoke screen on the wall -->
  <rect x="104" y="6" width="84" height="44" rx="3" fill="#2B2350" stroke="#1A1A1A" stroke-width="2.5"/>
  <text x="146" y="18" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="9" fill="#FF5FA2" letter-spacing="1">KARAOKE</text>
  <rect x="114" y="25" width="64" height="5" rx="2.5" fill="#FFFFFF" opacity="0.35"/>
  <rect x="114" y="25" width="38" height="5" rx="2.5" fill="#FFE14D"/>
  <rect x="114" y="35" width="52" height="5" rx="2.5" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="154" cy="22" r="2.2" fill="#FF5FA2"/>
  <rect x="110" y="50" width="4" height="6" fill="#1A1A1A"/>
  <rect x="178" y="50" width="4" height="6" fill="#1A1A1A"/>

  <!-- Bed -->
  <rect x="12" y="56" width="9" height="68" rx="2" fill="#8A96A2" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="26" y="106" width="5" height="18" fill="#6E7A86"/>
  <rect x="128" y="106" width="5" height="18" fill="#6E7A86"/>
  <rect x="18" y="96" width="122" height="11" rx="2" fill="#9AA5B0" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="20" y="88" width="118" height="10" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Joanna, propped up on the pillow, mid-contraction -->
  <ellipse cx="38" cy="80" rx="16" ry="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M29 62 Q27 46 43 45 Q59 45 57 62 Q60 70 57 76 Q61 82 58 89 Q54 95 49 91 Q52 85 49 79 Q51 72 49 66 L37 66 Q35 72 37 79 Q34 85 37 91 Q32 95 28 89 Q25 82 29 76 Q26 70 29 62 Z" fill="#6E4128" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M31.5 67 q-2.5 6 0.5 12 q-2.5 5 0 10 M54.5 67 q2.5 6 -0.5 12 q2.5 5 0 10" fill="none" stroke="#B07A4E" stroke-width="2" stroke-linecap="round"/>
  <path d="M30 84 q-1 4 1 7 M56 84 q1 4 -1 7" fill="none" stroke="#C99466" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="43" cy="62" rx="9" ry="10.5" fill="#F6D3BC" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M34 58 Q37 50 43 50.5 Q49 50 52 58 Q48 53 43.4 53.5 L42.6 53.5 Q38 53 34 58 Z" fill="#6E4128"/>
  <path d="M37.5 61 q2 -1.6 4 0 M45 61 q2 -1.6 4 0" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M36 58 l4 1.2 M50 58 l-4 1.2" stroke="#1A1A1A" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="43" cy="68.5" rx="2.6" ry="3" fill="#7A2A2A"/>
  <circle cx="37" cy="65" r="2" fill="#E88080" opacity="0.8"/>
  <circle cx="49" cy="65" r="2" fill="#E88080" opacity="0.8"/>
  <path d="M58 52 q2.5 4 0 6 q-2.5 -2 0 -6 Z M61 60 q2 3 0 4.6 q-2 -1.6 0 -4.6 Z" fill="#7FB3E6" stroke="#1A1A1A" stroke-width="0.8"/>
  <!-- Blanket over the bump -->
  <path d="M50 92 L50 80 Q62 74 74 79 Q86 56 106 72 Q114 78 138 82 L138 92 Z" fill="#9CC3EA" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M52 87 H136" stroke="#6F9ED0" stroke-width="2"/>
  <!-- Her hand gripping the bed rail -->
  <ellipse cx="58" cy="83" rx="4" ry="3.4" fill="#F2C9AE" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Doctor at the foot of the bed -->
  <rect x="152" y="112" width="8" height="12" fill="#227566" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="164" y="112" width="8" height="12" fill="#227566" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M150 76 Q162 70 174 76 L176 114 H148 Z" fill="#2E9C8A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M162 74 V112" stroke="#227566" stroke-width="1.5"/>
  <circle cx="162" cy="62" r="9.5" fill="#C9906E" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M152.5 60 Q152 50 162 50 Q172 50 171.5 60 Z" fill="#2E9C8A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <rect x="155" y="63" width="14" height="7" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
  <circle cx="158.5" cy="60.5" r="1.2" fill="#1A1A1A"/>
  <circle cx="165.5" cy="60.5" r="1.2" fill="#1A1A1A"/>
  <rect x="140" y="84" width="14" height="18" rx="1.5" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M143 90 H151 M143 94 H151 M143 98 H148" stroke="#9AA5B0" stroke-width="1.4"/>
  <circle cx="153" cy="94" r="3" fill="#C9906E" stroke="#1A1A1A" stroke-width="1.4"/>

  <!-- David, front and centre, giving it everything -->
  <!-- legs -->
  <path d="M212 120 L208 154 H220 L224 124 Z M236 124 L240 154 H252 L246 120 Z" fill="#3B4A63" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M205 154 H222 M238 154 H255" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
  <!-- outstretched arm (behind the body) -->
  <path d="M246 84 Q262 74 274 58" fill="none" stroke="#1A1A1A" stroke-width="10" stroke-linecap="round"/>
  <path d="M246 84 Q262 74 274 58" fill="none" stroke="#F6F1E7" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="275" cy="56" r="5" fill="#F0CDB0" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- tee -->
  <path d="M208 82 Q229 72 250 82 L248 124 H210 Z" fill="#F6F1E7" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M220 79 Q229 100 238 79" fill="none" stroke="#9EA4AB" stroke-width="1.4"/>
  <circle cx="229" cy="98.5" r="2.8" fill="none" stroke="#9EA4AB" stroke-width="1.6"/>
  <path d="M220 108 q2 -3 4 0 t4 0 t4 0 t4 0 t3 0" fill="none" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round"/>
  <!-- neck and head -->
  <rect x="223" y="70" width="12" height="10" fill="#D9AE90" stroke="#1A1A1A" stroke-width="1.6"/>
  <ellipse cx="229" cy="55" rx="14" ry="16" fill="#F0CDB0" stroke="#1A1A1A" stroke-width="2"/>
  <!-- quiff -->
  <path d="M214.5 53 Q212 41 221 37 Q229 31.5 238 34.5 Q246 37.5 243.5 53 Q241 45.5 233 44 Q224 43.5 219 47.5 Q216.5 50 214.5 53 Z" fill="#3B2A1F" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M222 41 q6 -3.5 13 -2 M220 44.5 q7 -3 15 -1.5" fill="none" stroke="#5A4231" stroke-width="1.2" stroke-linecap="round"/>
  <!-- beard, with the mouth wide open -->
  <path d="M215.5 57 Q216 72.5 229 74.5 Q242 72.5 242.5 57 Q240 61.5 236 61 Q229 58.5 222 61 Q218 61.5 215.5 57 Z" fill="#3B2A1F" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="229" cy="65" rx="5" ry="5.5" fill="#7A2A2A" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M225.5 61.6 Q229 60.6 232.5 61.6" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
  <!-- eyes shut, brows up: feeling it -->
  <path d="M220 52 q3 2.4 6 0 M232 52 q3 2.4 6 0" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M219.5 46.5 q3.5 -2.5 7 -0.5 M231.5 46 q3.5 -2 7 0.5" fill="none" stroke="#2A1D15" stroke-width="2" stroke-linecap="round"/>
  <!-- mic arm, mic at his mouth -->
  <path d="M210 86 Q198 96 205 78" fill="none" stroke="#1A1A1A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M210 86 Q198 96 205 78" fill="none" stroke="#F6F1E7" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M207 80 L217 67" stroke="#1A1A1A" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M207 80 L217 67" stroke="#3A3A3A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="206" cy="79" r="4.6" fill="#F0CDB0" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="219" cy="64" r="5.2" fill="#C8CDD3" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M216 62 L222 66 M216 66 L222 62 M219 59.5 V68.5" stroke="#8A9199" stroke-width="0.9"/>

  <!-- Music pouring out -->
  <use href="#note" x="250" y="40"/>
  <use href="#notes2" x="256" y="22"/>
  <use href="#note" x="200" y="40"/>
  <use href="#note" x="270" y="34" transform="rotate(10 270 34)"/>
  <path d="M244 60 q4 -3 8 0 M246 66 q5 -3 10 0" fill="none" stroke="#FFB800" stroke-width="1.6" stroke-linecap="round"/>
</svg>
